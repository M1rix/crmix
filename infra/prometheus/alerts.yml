groups:
  - name: crmix-backend
    rules:
      - alert: CrmixBackendDown
        expr: up{job="crmix-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRMIX backend is down"
          description: "Prometheus cannot scrape the CRMIX backend for more than two minutes."
      - alert: CrmixHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="crmix-backend",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="crmix-backend"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CRMIX 5xx rate is above 5%"
          description: "More than 5% of backend requests are returning 5xx responses for five minutes."
