name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'
          cache-provider: basic
      - name: Backend tests
        working-directory: backend
        run: gradle --no-daemon test
      - name: Backend build
        working-directory: backend
        run: gradle --no-daemon bootJar

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        working-directory: frontend
        run: npm install
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Nginx configuration
        run: >-
          docker run --rm
          --add-host backend:127.0.0.1
          --add-host frontend:127.0.0.1
          -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t
      - name: Validate production Compose model
        env:
          GRAFANA_ADMIN_PASSWORD: ci-only-password
          POSTGRES_ADMIN_PASSWORD: ci-only-postgres-password
          DB_PASSWORD: ci-only-app-password
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
          BACKUP_S3_URI: s3://ci-placeholder/crmix
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.prod.yml
          -f docker-compose.monitoring.yml
          config --quiet
