services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crmix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_dev_password}
      CRMIX_DB_PASSWORD: ${DB_PASSWORD:-crmix_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-create-app-user.sh:/docker-entrypoint-initdb.d/001-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crmix"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: jdbc:postgresql://postgres:5432/crmix
      DB_USERNAME: crmix_app
      DB_PASSWORD: ${DB_PASSWORD:-crmix_dev_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-only-change-me-local-only}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      PAYME_LOGIN: ${PAYME_LOGIN:-Paycom}
      PAYME_SECRET: ${PAYME_SECRET:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://test.paycom.uz}
      PAYME_CALLBACK_URL: ${PAYME_CALLBACK_URL:-http://localhost:8088/billing}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
