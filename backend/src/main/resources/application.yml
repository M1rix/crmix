spring:
  application:
    name: crmix
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crmix}
    username: ${DB_USERNAME:crmix_app}
    password: ${DB_PASSWORD:crmix_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    uz.mirix.crmix: INFO
