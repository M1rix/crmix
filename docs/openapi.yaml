openapi: 3.1.0
info:
  title: CRMIX API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /tenants/register:
    post:
      operationId: registerTenant
      responses:
        '201': { description: Tenant registered }
        '409': { description: Tenant or user conflict }
  /auth/login:
    post:
      operationId: login
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid credentials }
  /auth/refresh:
    post:
      operationId: refresh
      responses:
        '200': { description: Token pair rotated }
        '401': { description: Invalid refresh token }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Refresh token revoked }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
